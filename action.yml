name: 'CI Failure Context Collector'
description: 'Collects and summarises GitHub Actions failure context for root-cause analysis.'
author: 'acme'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  run-id:
    description: 'Workflow run ID to analyse (collect / train / deliver). Usually github.event.workflow_run.id.'
    required: false
    default: ''
  repository:
    description: 'owner/repo to analyse.'
    required: false
    default: ${{ github.repository }}
  mode:
    description: >-
      collect | train | deliver | feedback | migrate-history. "train" builds the
      Drain3 baseline from a successful run. "deliver" posts (or, with deliver
      false, previews) the PR / commit comment, issue and notifications from a
      downloaded rca/ artifact. "feedback" handles /resolved comments.
      "migrate-history" copies the cache history into issues. collect / train
      stay read-only.
    required: false
    default: 'collect'
  github-token:
    description: >-
      Token with actions:read and contents:read. Delivery modes write with this token
      (default: the job's GITHUB_TOKEN, limited by the job's permissions:).
    required: false
    default: ${{ github.token }}
  github-api-url:
    description: 'Override GitHub REST API base. Leave empty to use GITHUB_API_URL / autodetect.'
    required: false
    default: ''
  github-server-url:
    description: 'Override GitHub server URL. Leave empty to use GITHUB_SERVER_URL / autodetect.'
    required: false
    default: ''
  output-dir:
    description: 'Directory for summary.json and summary.md, relative to the workspace.'
    required: false
    default: 'rca'
  token-budget:
    description: 'Total evidence token budget. See §8.'
    required: false
    default: '6000'
  drain-cache-dir:
    description: 'Drain3 baseline state directory. Caller is responsible for caching it.'
    required: false
    default: '.drain'
  history-dir:
    description: 'Fingerprint history directory, used by the cache backend. Caller caches it.'
    required: false
    default: '.rca-history'
  history-backend:
    description: >-
      Where collect keeps failure memory: cache | none. Recurring-failure issues are
      delivery-owned (mode deliver / migrate-history), never a collect backend.
    required: false
    default: 'cache'
  history-redis-url:
    description: 'Reserved and currently ignored: no redis history backend is implemented.'
    required: false
    default: ''
  python-version:
    description: 'Python to set up. Ignored when setup-python is false.'
    required: false
    default: '3.12'
  setup-python:
    description: 'Set false on self-hosted images that already ship a suitable Python.'
    required: false
    default: 'true'
  write-job-summary:
    description: 'Append summary.md to $GITHUB_STEP_SUMMARY.'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail the step if collection itself errors. Default false — see §13.'
    required: false
    default: 'false'
  ssl-verify:
    description: 'Verify TLS certificates. Set false only for GHES with a private CA you cannot install.'
    required: false
    default: 'true'
  ssl-cert-file:
    description: 'Path to a CA bundle (PEM). Used as httpx verify= when set.'
    required: false
    default: ''
  analyze:
    description: 'Run the ST ChatGPT analyze step after collect. Skipped when the API key is empty.'
    required: false
    default: 'true'
  analyze-policy:
    description: >-
      When to call the model (analyze must also be on): auto = skip only when the
      deterministic answer is trustworthy and anchored at the failed step;
      always = call whenever possible; never = never call, always render the
      deterministic card.
    required: false
    default: 'auto'
  write-telemetry:
    description: 'Append one per-run telemetry line to the cached history dir for later aggregation.'
    required: false
    default: 'true'
  analyze-pipeline-logs:
    description: 'Download and parse pipeline/docker log artifacts as evidence streams.'
    required: false
    default: 'true'
  max-pipeline-log-artifacts:
    description: 'Max pipeline/docker log zips to download (failed-stage first; fail-side has priority).'
    required: false
    default: '3'
  stgpt-api-key:
    description: 'ST ChatGPT bridge API key. Falls back to env STGPT_API. Leave empty to skip analyze.'
    required: false
    default: ''
  stgpt-api-url:
    description: 'Override ST ChatGPT bridge base URL. Leave empty to use STGPT_API_URL / the default.'
    required: false
    default: ''
  stgpt-client-app-name:
    description: 'ST ChatGPT clientAppName. Empty uses STGPT_CLIENT_APP_NAME / default gtrd_srmtdpplm.'
    required: false
    default: ''
  workflow-name:
    description: 'Failed workflow name for Drain3/history cache keys. Defaults to workflow_run.name or github.workflow.'
    required: false
    default: ''
  deliver:
    description: >-
      Delivery modes only. true posts / edits comments, issues and notifications;
      false (default) is a dry run with zero GitHub writes — rca/delivery-preview.md
      shows exactly what would be posted.
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Sticky RCA comment on the pull request.'
    required: false
    default: 'true'
  comment-on-commit:
    description: 'Commit comment for default-branch / tag failures.'
    required: false
    default: 'true'
  comment-on-branch-push:
    description: 'Commit comment for pushes to other branches (needs comment-on-commit).'
    required: false
    default: 'false'
  create-issues:
    description: 'Open / maintain one issue per failure fingerprint.'
    required: false
    default: 'true'
  issue-threshold:
    description: 'Times seen before a PR / branch failure gets an issue (default-branch, tag and schedule failures always do).'
    required: false
    default: '3'
  allow-fork-issues:
    description: 'Open issues for failures on fork pull requests.'
    required: false
    default: 'false'
  confidence-threshold:
    description: 'low | medium | high. Below it the comment omits root-cause claims.'
    required: false
    default: 'medium'
  quiet-window-minutes:
    description: 'Per-fingerprint quiet window for edits and notifications.'
    required: false
    default: '60'
  platform-team:
    description: 'Owners for infrastructure failures (e.g. @org/platform or an email). Never blamed on the actor.'
    required: false
    default: ''
  default-notify:
    description: 'Fallback owners / recipients when nothing else resolves.'
    required: false
    default: ''
  smtp-url:
    description: >-
      Email channel, e.g. smtp://user:pass@host:587?from=ci@example.com. A credential:
      pass it from a secret. Reaches the tool only as the RCA_SMTP_URL env var.
    required: false
    default: ''
  chat-webhook-url:
    description: >-
      Chat webhook (https only). A credential: pass it from a secret. Reaches the
      tool only as the RCA_CHAT_WEBHOOK_URL env var.
    required: false
    default: ''
  chat-payload-field:
    description: 'JSON field for the chat text (default text; e.g. content for some providers).'
    required: false
    default: ''
  default-branch:
    description: 'Fallback default branch. Empty uses the event repository default branch; the API lookup wins.'
    required: false
    default: ''
  migrate-limit:
    description: 'migrate-history: max issues created per run (re-runs continue).'
    required: false
    default: '50'

outputs:
  summary-path:
    description: 'Path to summary.md.'
    value: ${{ steps.collect.outputs.summary-path }}
  json-path:
    description: 'Path to summary.json.'
    value: ${{ steps.collect.outputs.json-path }}
  category:
    description: 'Heuristic classification: oom, dependency, compile, test_failure, release (version/package already published), etc.'
    value: ${{ steps.collect.outputs.category }}
  confidence:
    description: 'high | medium | low.'
    value: ${{ steps.collect.outputs.confidence }}
  is-infra-vs-code:
    description: 'infra | code | unknown.'
    value: ${{ steps.collect.outputs.is-infra-vs-code }}
  is-flaky:
    description: 'true when the same SHA passed in another run.'
    value: ${{ steps.collect.outputs.is-flaky }}
  short-circuit:
    description: 'infra_runner | infra_widespread | flake_same_sha_passed | no_failed_jobs | empty string.'
    value: ${{ steps.collect.outputs.short-circuit }}
  requires-analysis:
    description: 'false when a deterministic verdict was reached. Always set by Report analysis in collect mode.'
    value: ${{ steps.analyze.outputs.requires-analysis || steps.collect.outputs.requires-analysis }}
  fingerprint:
    description: '16-hex-char failure fingerprint.'
    value: ${{ steps.collect.outputs.fingerprint }}
  seen-count:
    description: 'Times this fingerprint has been seen before.'
    value: ${{ steps.collect.outputs.seen-count }}
  recurrence:
    description: 'new | similar | exact. See §10.2.'
    value: ${{ steps.collect.outputs.recurrence }}
  failed-job-count:
    description: 'Number of failed jobs found.'
    value: ${{ steps.collect.outputs.failed-job-count }}
  suspected-stage:
    description: 'Deterministic suspected stage (build, test, e2e, lint).'
    value: ${{ steps.analyze.outcome == 'skipped' && steps.collect.outputs.suspected-stage || steps.analyze.outputs.suspected-stage }}
  suspected-files:
    description: 'Comma-separated suspected source files (max 5). Analyze may only keep the Python shortlist.'
    value: ${{ steps.analyze.outcome == 'skipped' && steps.collect.outputs.suspected-files || steps.analyze.outputs.suspected-files }}
  deterministic-rule:
    description: 'Winning deterministic rule id (R14, R8, …) or empty.'
    value: ${{ steps.analyze.outcome == 'skipped' && steps.collect.outputs.deterministic-rule || steps.analyze.outputs.deterministic-rule }}
  diagnosis-source:
    description: 'deterministic | ai | gated | none.'
    value: ${{ steps.analyze.outcome == 'skipped' && steps.collect.outputs.diagnosis-source || steps.analyze.outputs.diagnosis-source }}
  root-cause:
    description: 'LLM root cause. Empty when analyze was skipped.'
    value: ${{ steps.analyze.outputs.root-cause }}
  suggested-fix:
    description: 'LLM suggested fix. Empty when analyze was skipped.'
    value: ${{ steps.analyze.outputs.suggested-fix }}
  rca-confidence:
    description: 'LLM confidence: high | medium | low. Empty when analyze was skipped.'
    value: ${{ steps.analyze.outputs.rca-confidence }}
  analysis-status:
    description: 'ok | cached | gated | unvalidated | failed. Empty when analyze was skipped.'
    value: ${{ steps.analyze.outputs.analysis-status }}
  analysis-notes:
    description: 'Analyze notes (HTTP errors, gate reasons). Empty when skipped.'
    value: ${{ steps.analyze.outputs.analysis-notes }}
  drain-cache-key:
    description: 'Sanitized actions/cache key for the Drain3 baseline.'
    value: ${{ steps.cache-keys.outputs.drain-cache-key }}
  history-cache-key:
    description: 'Sanitized actions/cache key for fingerprint history (repo+workflow, not run-id).'
    value: ${{ steps.cache-keys.outputs.history-cache-key }}
  severity:
    description: 'deliver: critical | high | normal | low | info.'
    value: ${{ steps.deliver.outputs.severity }}
  suppressed-by:
    description: 'deliver: why nothing was posted (flaky, infra_widespread, infra_runner, draft, delivery_error) or empty.'
    value: ${{ steps.deliver.outputs.suppressed-by }}
  delivered-to:
    description: 'deliver: comma list of what landed (pr_comment, commit_comment, issue:*, chat, email, label:ci:flaky).'
    value: ${{ steps.deliver.outputs.delivered-to }}
  comment-url:
    description: 'deliver: URL of the sticky PR / commit comment, or empty.'
    value: ${{ steps.deliver.outputs.comment-url }}
  issue-url:
    description: 'deliver: URL of the fingerprint issue, or empty.'
    value: ${{ steps.deliver.outputs.issue-url }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      if: inputs.setup-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install collector dependencies
      shell: bash
      run: |
        python --version
        pip --version
        pip install --disable-pip-version-check -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Compute cache keys
      id: cache-keys
      if: inputs.mode == 'collect' || inputs.mode == 'train'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        RCA_WORKFLOW_NAME: ${{ inputs.workflow-name != '' && inputs.workflow-name || github.event.workflow_run.name || github.workflow }}
        RCA_JOB_NAME: ${{ github.job }}
        RCA_REPO: ${{ inputs.repository }}
      run: |
        python -m tools.rca.cli cache-keys \
          --workflow-name "$RCA_WORKFLOW_NAME" \
          --job-name "$RCA_JOB_NAME" \
          --repository "$RCA_REPO"

    # Combined cache@v4 (restore at start, save at job end). Nested
    # actions/cache/restore and actions/cache/save are often missing on
    # GHES mirrors ("repository not found").
    - name: Cache Drain3 baseline
      if: inputs.mode == 'collect' || inputs.mode == 'train'
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ${{ inputs.drain-cache-dir }}
        key: ${{ steps.cache-keys.outputs.drain-cache-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.drain-cache-restore-key }}

    - name: Cache fingerprint history
      if: inputs.mode == 'collect' || inputs.mode == 'train'
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ${{ inputs.history-dir }}
        key: ${{ steps.cache-keys.outputs.history-cache-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.history-cache-restore-key }}
          rca-history-

    - name: Run collector
      id: collect
      if: inputs.mode == 'collect' || inputs.mode == 'train'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMON_ACTIONS_PAT: ${{ env.COMMON_ACTIONS_PAT }}
        GITHUB_API_URL: ${{ inputs.github-api-url != '' && inputs.github-api-url || env.GITHUB_API_URL }}
        GITHUB_SERVER_URL: ${{ inputs.github-server-url != '' && inputs.github-server-url || env.GITHUB_SERVER_URL }}
        RCA_GITHUB_API_URL: ${{ inputs.github-api-url }}
        RCA_GITHUB_HOST: ${{ inputs.github-server-url }}
        PYTHONPATH: ${{ github.action_path }}
        RCA_DRAIN_CONFIG: ${{ github.action_path }}/drain3.ini
        RCA_REDIS_URL: ${{ inputs.history-redis-url }}
        RCA_MODE: ${{ inputs.mode }}
        RCA_RUN_ID: ${{ inputs.run-id }}
        RCA_REPO: ${{ inputs.repository }}
        RCA_OUT: ${{ inputs.output-dir }}
        RCA_TOKEN_BUDGET: ${{ inputs.token-budget }}
        RCA_DRAIN_DIR: ${{ inputs.drain-cache-dir }}
        RCA_HISTORY_DIR: ${{ inputs.history-dir }}
        RCA_HISTORY_BACKEND: ${{ inputs.history-backend }}
        RCA_STRICT: ${{ inputs.fail-on-error }}
        RCA_SSL_VERIFY: ${{ inputs.ssl-verify }}
        RCA_SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
        RCA_ANALYZE_PIPELINE_LOGS: ${{ inputs.analyze-pipeline-logs }}
        RCA_MAX_PIPELINE_LOG_ARTIFACTS: ${{ inputs.max-pipeline-log-artifacts }}
        RCA_DRAIN_CACHE_KEY: ${{ steps.cache-keys.outputs.drain-cache-key }}
        RCA_HISTORY_CACHE_KEY: ${{ steps.cache-keys.outputs.history-cache-key }}
        RCA_WORKFLOW_NAME: ${{ inputs.workflow-name != '' && inputs.workflow-name || github.event.workflow_run.name || github.workflow }}
        SSL_CERT_FILE: ${{ env.SSL_CERT_FILE }}
        REQUESTS_CA_BUNDLE: ${{ env.REQUESTS_CA_BUNDLE }}
      run: |
        extra=()
        if [ "$RCA_STRICT" = "true" ]; then
          extra+=(--strict)
        fi
        if [ "$RCA_ANALYZE_PIPELINE_LOGS" = "false" ]; then
          extra+=(--no-analyze-pipeline-logs)
        fi
        if [ -n "$RCA_MAX_PIPELINE_LOG_ARTIFACTS" ]; then
          extra+=(--max-pipeline-log-artifacts "$RCA_MAX_PIPELINE_LOG_ARTIFACTS")
        fi
        python -m tools.rca.cli "$RCA_MODE" \
          --run-id "$RCA_RUN_ID" \
          --repo "$RCA_REPO" \
          --out "$RCA_OUT" \
          --token-budget "$RCA_TOKEN_BUDGET" \
          --drain-dir "$RCA_DRAIN_DIR" \
          --history-dir "$RCA_HISTORY_DIR" \
          --history-backend "$RCA_HISTORY_BACKEND" \
          "${extra[@]}"

    - name: Report analysis
      id: analyze
      if: inputs.mode == 'collect'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        RCA_OUT: ${{ inputs.output-dir }}
        RCA_STRICT: ${{ inputs.fail-on-error }}
        RCA_SSL_VERIFY: ${{ inputs.ssl-verify }}
        RCA_SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
        SSL_CERT_FILE: ${{ env.SSL_CERT_FILE }}
        REQUESTS_CA_BUNDLE: ${{ env.REQUESTS_CA_BUNDLE }}
        RCA_MODE: ${{ inputs.mode }}
        RCA_ANALYZE_ENABLED: ${{ inputs.analyze }}
        RCA_ANALYZE_POLICY: ${{ inputs.analyze-policy }}
        RCA_HISTORY_DIR: ${{ inputs.history-dir }}
        RCA_WRITE_TELEMETRY: ${{ inputs.write-telemetry }}
        RCA_REQUIRES_ANALYSIS: ${{ steps.collect.outputs.requires-analysis }}
        RCA_STGPT_KEY_PRESENT: ${{ (inputs.stgpt-api-key != '' || env.STGPT_API != '') && 'true' || 'false' }}
        STGPT_API: ${{ inputs.stgpt-api-key != '' && inputs.stgpt-api-key || env.STGPT_API }}
        STGPT_API_URL: ${{ inputs.stgpt-api-url != '' && inputs.stgpt-api-url || env.STGPT_API_URL }}
        STGPT_CLIENT_APP_NAME: ${{ inputs.stgpt-client-app-name != '' && inputs.stgpt-client-app-name || env.STGPT_CLIENT_APP_NAME }}
        STGPT_PERSONA: ${{ env.STGPT_PERSONA }}
      run: |
        extra=()
        if [ "$RCA_STRICT" = "true" ]; then
          extra+=(--strict)
        fi
        python -m tools.rca.cli analyze \
          --summary "$RCA_OUT/summary.json" \
          --out "$RCA_OUT" \
          --mode "$RCA_MODE" \
          --analyze-enabled "$RCA_ANALYZE_ENABLED" \
          --analyze-policy "$RCA_ANALYZE_POLICY" \
          --history-dir "$RCA_HISTORY_DIR" \
          --write-telemetry "$RCA_WRITE_TELEMETRY" \
          --requires-analysis "$RCA_REQUIRES_ANALYSIS" \
          --stgpt-key-present "$RCA_STGPT_KEY_PRESENT" \
          "${extra[@]}"

    - name: Write job summary
      if: inputs.write-job-summary == 'true' && inputs.mode == 'collect'
      shell: bash
      env:
        RCA_OUT: ${{ inputs.output-dir }}
      run: |
        if [ -f "$RCA_OUT/summary.md" ]; then
          cat "$RCA_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    # ---- Phase 3 delivery (write scopes live only in the job that runs these modes) ----
    # Every value reaches the scripts through env: — never ${{ }} inside run:.
    - name: Deliver
      id: deliver
      if: inputs.mode == 'deliver'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Writes use this token (RCA_GITHUB_TOKEN wins over any org PAT), so the
        # job's permissions: block bounds what delivery can do (v1.3 §3).
        RCA_GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ inputs.github-api-url != '' && inputs.github-api-url || env.GITHUB_API_URL }}
        GITHUB_SERVER_URL: ${{ inputs.github-server-url != '' && inputs.github-server-url || env.GITHUB_SERVER_URL }}
        RCA_GITHUB_API_URL: ${{ inputs.github-api-url }}
        RCA_GITHUB_HOST: ${{ inputs.github-server-url }}
        PYTHONPATH: ${{ github.action_path }}
        RCA_SSL_VERIFY: ${{ inputs.ssl-verify }}
        RCA_SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
        SSL_CERT_FILE: ${{ env.SSL_CERT_FILE }}
        REQUESTS_CA_BUNDLE: ${{ env.REQUESTS_CA_BUNDLE }}
        RCA_OUT: ${{ inputs.output-dir }}
        RCA_REPO: ${{ inputs.repository }}
        RCA_STRICT: ${{ inputs.fail-on-error }}
        RCA_DELIVER: ${{ inputs.deliver }}
        RCA_WRITE_SUMMARY: ${{ inputs.write-job-summary }}
        RCA_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        RCA_COMMENT_ON_COMMIT: ${{ inputs.comment-on-commit }}
        RCA_COMMENT_ON_BRANCH_PUSH: ${{ inputs.comment-on-branch-push }}
        RCA_CREATE_ISSUES: ${{ inputs.create-issues }}
        RCA_ISSUE_THRESHOLD: ${{ inputs.issue-threshold }}
        RCA_ALLOW_FORK_ISSUES: ${{ inputs.allow-fork-issues }}
        RCA_CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
        RCA_QUIET_WINDOW_MINUTES: ${{ inputs.quiet-window-minutes }}
        RCA_PLATFORM_TEAM: ${{ inputs.platform-team }}
        RCA_DEFAULT_NOTIFY: ${{ inputs.default-notify }}
        RCA_SMTP_URL: ${{ inputs.smtp-url }}
        RCA_CHAT_WEBHOOK_URL: ${{ inputs.chat-webhook-url }}
        RCA_CHAT_PAYLOAD_FIELD: ${{ inputs.chat-payload-field }}
        RCA_DEFAULT_BRANCH: ${{ inputs.default-branch != '' && inputs.default-branch || github.event.repository.default_branch }}
      run: |
        if [ -n "$RCA_SMTP_URL" ]; then echo "::add-mask::$RCA_SMTP_URL"; fi
        if [ -n "$RCA_CHAT_WEBHOOK_URL" ]; then echo "::add-mask::$RCA_CHAT_WEBHOOK_URL"; fi
        args=(deliver --summary "$RCA_OUT/summary.json" --out "$RCA_OUT")
        if [ -n "$RCA_REPO" ]; then args+=(--repo "$RCA_REPO"); fi
        if [ -f "$RCA_OUT/analysis.json" ]; then args+=(--analysis "$RCA_OUT/analysis.json"); fi
        if [ "$RCA_DELIVER" = "true" ]; then args+=(--live); else args+=(--dry-run); fi
        opt() { if [ -n "$2" ]; then args+=("$1" "$2"); fi; }
        opt --comment-on-pr "$RCA_COMMENT_ON_PR"
        opt --comment-on-commit "$RCA_COMMENT_ON_COMMIT"
        opt --comment-on-branch-push "$RCA_COMMENT_ON_BRANCH_PUSH"
        opt --create-issues "$RCA_CREATE_ISSUES"
        opt --issue-threshold "$RCA_ISSUE_THRESHOLD"
        opt --allow-fork-issues "$RCA_ALLOW_FORK_ISSUES"
        opt --confidence-threshold "$RCA_CONFIDENCE_THRESHOLD"
        opt --quiet-window-minutes "$RCA_QUIET_WINDOW_MINUTES"
        opt --platform-team "$RCA_PLATFORM_TEAM"
        opt --default-notify "$RCA_DEFAULT_NOTIFY"
        if [ "$RCA_STRICT" = "true" ]; then args+=(--strict); fi
        python -m tools.rca.cli "${args[@]}"
        if [ "$RCA_WRITE_SUMMARY" = "true" ] && [ -f "$RCA_OUT/delivery-preview.md" ]; then
          { echo "## RCA delivery"; echo; cat "$RCA_OUT/delivery-preview.md"; } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Feedback
      id: feedback
      if: inputs.mode == 'feedback'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Writes use this token (RCA_GITHUB_TOKEN wins over any org PAT), so the
        # job's permissions: block bounds what delivery can do (v1.3 §3).
        RCA_GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ inputs.github-api-url != '' && inputs.github-api-url || env.GITHUB_API_URL }}
        GITHUB_SERVER_URL: ${{ inputs.github-server-url != '' && inputs.github-server-url || env.GITHUB_SERVER_URL }}
        RCA_GITHUB_API_URL: ${{ inputs.github-api-url }}
        RCA_GITHUB_HOST: ${{ inputs.github-server-url }}
        PYTHONPATH: ${{ github.action_path }}
        RCA_SSL_VERIFY: ${{ inputs.ssl-verify }}
        RCA_SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
        SSL_CERT_FILE: ${{ env.SSL_CERT_FILE }}
        REQUESTS_CA_BUNDLE: ${{ env.REQUESTS_CA_BUNDLE }}
        RCA_OUT: ${{ inputs.output-dir }}
        RCA_REPO: ${{ inputs.repository }}
        RCA_STRICT: ${{ inputs.fail-on-error }}
        RCA_DELIVER: ${{ inputs.deliver }}
        RCA_WRITE_SUMMARY: ${{ inputs.write-job-summary }}
      run: |
        args=(feedback --event "$GITHUB_EVENT_PATH" --out "$RCA_OUT")
        if [ -n "$RCA_REPO" ]; then args+=(--repo "$RCA_REPO"); fi
        if [ "$RCA_DELIVER" = "true" ]; then args+=(--live); else args+=(--dry-run); fi
        if [ "$RCA_STRICT" = "true" ]; then args+=(--strict); fi
        python -m tools.rca.cli "${args[@]}"
        if [ "$RCA_WRITE_SUMMARY" = "true" ] && [ -f "$RCA_OUT/feedback-report.md" ]; then
          { echo "## RCA feedback"; echo; cat "$RCA_OUT/feedback-report.md"; } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Migrate history
      id: migrate
      if: inputs.mode == 'migrate-history'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Writes use this token (RCA_GITHUB_TOKEN wins over any org PAT), so the
        # job's permissions: block bounds what delivery can do (v1.3 §3).
        RCA_GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ inputs.github-api-url != '' && inputs.github-api-url || env.GITHUB_API_URL }}
        GITHUB_SERVER_URL: ${{ inputs.github-server-url != '' && inputs.github-server-url || env.GITHUB_SERVER_URL }}
        RCA_GITHUB_API_URL: ${{ inputs.github-api-url }}
        RCA_GITHUB_HOST: ${{ inputs.github-server-url }}
        PYTHONPATH: ${{ github.action_path }}
        RCA_SSL_VERIFY: ${{ inputs.ssl-verify }}
        RCA_SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
        SSL_CERT_FILE: ${{ env.SSL_CERT_FILE }}
        REQUESTS_CA_BUNDLE: ${{ env.REQUESTS_CA_BUNDLE }}
        RCA_OUT: ${{ inputs.output-dir }}
        RCA_REPO: ${{ inputs.repository }}
        RCA_STRICT: ${{ inputs.fail-on-error }}
        RCA_DELIVER: ${{ inputs.deliver }}
        RCA_WRITE_SUMMARY: ${{ inputs.write-job-summary }}
        RCA_HISTORY_DIR: ${{ inputs.history-dir }}
        RCA_MIGRATE_LIMIT: ${{ inputs.migrate-limit }}
      run: |
        args=(deliver --migrate-history --history-dir "$RCA_HISTORY_DIR" --migrate-limit "$RCA_MIGRATE_LIMIT" --out "$RCA_OUT")
        if [ -n "$RCA_REPO" ]; then args+=(--repo "$RCA_REPO"); fi
        if [ "$RCA_DELIVER" = "true" ]; then args+=(--live); else args+=(--dry-run); fi
        if [ "$RCA_STRICT" = "true" ]; then args+=(--strict); fi
        python -m tools.rca.cli "${args[@]}"
        if [ "$RCA_WRITE_SUMMARY" = "true" ] && [ -f "$RCA_OUT/history-migration.md" ]; then
          { echo "## RCA history migration"; echo; cat "$RCA_OUT/history-migration.md"; } >> "$GITHUB_STEP_SUMMARY"
        fi
