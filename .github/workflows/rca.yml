name: RCA Collect (reusable)

on:
  workflow_call:
    inputs:
      run-id:        { required: true,  type: string }
      workflow-name: { required: true,  type: string }
      conclusion:    { required: true,  type: string }
      head-branch:   { required: false, type: string, default: '' }
      default-branch:{ required: false, type: string, default: 'main' }
      runs-on:       { required: false, type: string, default: 'ubuntu-latest' }
    outputs:
      category:      { value: ${{ jobs.collect.outputs.category }} }
      fingerprint:   { value: ${{ jobs.collect.outputs.fingerprint }} }
      is-flaky:      { value: ${{ jobs.collect.outputs.is-flaky }} }
      requires-analysis: { value: ${{ jobs.collect.outputs.requires-analysis }} }
      suspected-stage: { value: ${{ jobs.collect.outputs.suspected-stage }} }
      suspected-files: { value: ${{ jobs.collect.outputs.suspected-files }} }
      deterministic-rule: { value: ${{ jobs.collect.outputs.deterministic-rule }} }
      diagnosis-source: { value: ${{ jobs.collect.outputs.diagnosis-source }} }

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    outputs:
      category: ${{ steps.rca.outputs.category }}
      fingerprint: ${{ steps.rca.outputs.fingerprint }}
      is-flaky: ${{ steps.rca.outputs.is-flaky }}
      requires-analysis: ${{ steps.rca.outputs.requires-analysis }}
      suspected-stage: ${{ steps.rca.outputs.suspected-stage }}
      suspected-files: ${{ steps.rca.outputs.suspected-files }}
      deterministic-rule: ${{ steps.rca.outputs.deterministic-rule }}
      diagnosis-source: ${{ steps.rca.outputs.diagnosis-source }}
    steps:
      # Sanitize workflow names before actions/cache. Keys must match
      # ^[a-zA-Z0-9!#%'()+,-./<=>@_[{}~]+$ — spaces in names like
      # "Build Api-gateway" cause HTTP 400 and the restore never hits.
      #
      # History must restore across runs of the SAME workflow. A run-id-only
      # key (rca-history-160782) never hits on the next failure.
      # actions/cache is still a ~7 day LRU. Composite action also emits
      # drain-cache-key / history-cache-key from Python.
      - name: Sanitize cache keys
        id: keys
        shell: bash
        env:
          WF: ${{ inputs.workflow-name }}
          JOB: ${{ github.job }}
          REPO: ${{ github.repository }}
        run: |
          sanitize() {
            local s="${1:-unknown}"
            s="$(printf '%s' "$s" | tr '[:upper:]' '[:lower:]')"
            s="$(printf '%s' "$s" | tr -s '[:space:]' '-')"
            s="$(printf '%s' "$s" | sed -E 's/[^a-z0-9._-]+/-/g; s/-{2,}/-/g; s/^-+//; s/-+$//; s/^$/unknown/')"
            printf '%s' "${s:0:80}"
          }
          wf="$(sanitize "$WF")"
          job="$(sanitize "${JOB:-collect}")"
          repo="$(sanitize "$REPO")"
          {
            echo "workflow=$wf"
            echo "job=$job"
            echo "repo=$repo"
            echo "drain-cache-key=drain3-${wf}-${job}"
            echo "drain-cache-restore-key=drain3-${wf}-"
            echo "history-cache-key=rca-history-${repo}-${wf}"
            echo "history-cache-restore-key=rca-history-${repo}-"
          } >> "$GITHUB_OUTPUT"

      # Combined cache@v4 (restore at start, save at job end). Nested
      # actions/cache/restore and actions/cache/save are often missing on
      # GHES mirrors ("repository not found").
      - name: Cache Drain3 baseline
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .drain/
          key: ${{ steps.keys.outputs.drain-cache-key }}
          restore-keys: |
            ${{ steps.keys.outputs.drain-cache-restore-key }}

      - name: Cache fingerprint history
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .rca-history/
          key: ${{ steps.keys.outputs.history-cache-key }}
          restore-keys: |
            ${{ steps.keys.outputs.history-cache-restore-key }}
            rca-history-

      - name: Collect
        id: rca
        # Pin to this action repository (same ref as the workflow_call).
        uses: acme/ci-rca-collector@v1
        with:
          run-id: ${{ inputs.run-id }}
          mode: ${{ inputs.conclusion == 'success' && 'train' || 'collect' }}
          github-api-url: ''
          workflow-name: ${{ inputs.workflow-name }}

      - name: Upload artifact
        if: inputs.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rca-${{ inputs.run-id }}
          path: rca/
          retention-days: 30
